<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM_Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body class="body">
    <nav>
        <h1>Task Master</h1>
        <div>
            <button class="theme">Theme</button>
            <button class="nav-btn">Add Task</button>
            <button class="clear-all">Clear All</button>
        </div>
    </nav>

    <main>
        <div class="form">
            <form>
                <input type="text" placeholder="Task..." name="task" required>
                <input type="text" placeholder="Description..." name="description" required>
                <select id="" name="category">
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                    <option value="health">Health</option>
                    <option value="personal">Personal</option>
                    <option value="chill">Chill</option>
                </select>
                <div>
                    <input type="submit" value="Add Task" name="submit">
                <button class="cancel">Cancel</button>
                </div>
            </form>
        </div>

        <h1 class="y-task">Your Tasks</h1>

        <div class="search-box">
           <div class="search-div"> <i class="ri-search-line"></i>
            <input type="text" placeholder="Search your tasks" class="search"></div>
            <div><button class="search-btn">Search</button>
            <button class="all">All</button></div>
        </div>

        <div class="tasks">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
